<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MimiTube | Yuli 日語練習教室</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-pink: #FFC0CB; 
            --dark-pink: #FF80AB; 
            --bg-color: #FFF5F7; 
            --accent-mint: #A3D2CA; 
            --text-color: #5D5D5D; 
            --record-red: #FFB7B7;
        }
        body { font-family: 'Zen Maru Gothic', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding-bottom: 80px; display: flex; flex-direction: column; align-items: center; }
        
        /* 導覽列與日曆按鈕 */
        .header { width: 100%; background: white; padding: 15px 0; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 2px 10px rgba(255,192,203,0.3); position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Quicksand', sans-serif; font-size: 26px; font-weight: 600; color: var(--dark-pink); text-decoration: none; }
        .calendar-btn { background: white; border: 2px solid var(--primary-pink); padding: 8px 15px; border-radius: 20px; cursor: pointer; color: var(--dark-pink); font-weight: bold; transition: 0.3s; }
        .calendar-btn:hover { background: var(--primary-pink); color: white; }
        #date-picker { position: absolute; opacity: 0; pointer-events: none; }

        .main-content { padding: 20px; width: 95%; max-width: 640px; text-align: center; }
        .player-wrapper { width: 100%; aspect-ratio: 16 / 9; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 25px rgba(255,128,171,0.2); border: 6px solid white; background: #000; margin-bottom: 20px; }
        
        .ai-feedback { background: white; padding: 15px; border-radius: 20px; margin: 15px 0; border: 2px dashed var(--primary-pink); display: none; }
        .subtitle { background: #fff; margin-bottom: 12px; padding: 18px; border-radius: 20px; text-align: left; cursor: pointer; border: 3px solid transparent; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .subtitle.active { border-color: var(--primary-pink); background: #FFF0F3; }
        .jp-text { font-size: 1.2em; font-weight: 700; color: #444; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
        .btn { border: none; border-radius: 50px; padding: 15px 35px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; max-width: 400px; font-family: inherit; }
        .btn-ai { background: var(--dark-pink); color: white; font-size: 1.1em; }
        .btn-record { background: var(--record-red); color: white; font-size: 1em; }
        .btn-done { background: white; border: 3px solid var(--primary-pink); color: var(--dark-pink); margin-top: 20px; }
        .btn-done.completed { background-color: var(--primary-pink); border-color: var(--primary-pink); color: white; pointer-events: none; }
        
        audio { width: 100%; max-width: 400px; margin: 10px 0; display: none; }
        .recording-status { animation: pulse 1s infinite; color: #FF4081; font-weight: bold; }
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.5} 100% {opacity:1} }
    </style>
</head>
<body>
    <div class="header">
        <a href="#" class="logo">Mimi<span>Tube</span></a>
        <button class="calendar-btn" onclick="document.getElementById('date-picker').showPicker()">📅 換練習日期</button>
        <input type="date" id="date-picker" onchange="switchLesson(this.value)">
    </div>

    <div class="main-content">
        <div id="date-display" style="font-weight: bold; color: var(--dark-pink); margin-bottom: 5px;"></div>
        <h2 id="lesson-title">讀取中...</h2>
        <div class="player-wrapper"><div id="player"></div></div>

        <div id="ai-box" class="ai-feedback">
            <div id="ai-status"></div>
            <div style="font-size: 0.9em; margin-top:5px;">AI 聽到的：<span id="ai-transcript" style="color:var(--dark-pink); font-weight:bold;">...</span></div>
            <div id="ai-result" style="margin-top:10px; font-weight:bold;"></div>
        </div>

        <div class="btn-group">
            <button id="ai-btn" class="btn btn-ai" onclick="startSpeechAI()">🎤 啟動 AI 校正發音</button>
            <button id="manual-record-btn" class="btn btn-record" onclick="toggleManualRecord()">🎙️ 手動錄製比對</button>
            <audio id="audio-playback" controls></audio>
        </div>

        <div id="subtitle-list" style="margin-top: 20px;"></div>
        <button id="complete-btn" class="btn btn-done" onclick="saveMyProgress()">完成今日練習</button>
    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEXKJakE6c7TwGFVBHEUjOYsq3Tr1GO_hZVruVJcsb3y2plxlflzjGjlmyjrU1yV43GxdZXGqn57ie/pub?output=csv";
        let videoDB = {}, player, lStart = 0, lEnd = 0, targetJp = "";
        const todayKey = new Date().toLocaleDateString('sv-SE');

        async function fetchCSV() {
            try {
                const r = await fetch(`${SHEET_URL}&v=${Date.now()}`);
                const txt = await r.text();
                txt.split('\n').slice(1).forEach(line => {
                    const c = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (c.length >= 4) {
                        const date = c[0].trim();
                        const sData = c[3].replace(/"/g, '').split('|').map(s => {
                            const p = s.split(',');
                            return { jp: p[0], zh: p[1], t: parseFloat(p[2]) || 0 };
                        });
                        videoDB[date] = { id: c[1].replace(/["' ]/g, ""), title: c[2].replace(/"/g, ''), subs: sData };
                    }
                });
                loadYoutubeSDK();
            } catch(e) { console.error(e); }
        }

        function loadYoutubeSDK() {
            const t = document.createElement('script'); t.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(t);
        }

        function onYouTubeIframeAPIReady() {
            const lesson = videoDB[todayKey] || Object.values(videoDB)[0];
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: lesson ? lesson.id : '',
                playerVars: { 'playsinline': 1, 'rel': 0 },
                events: { 'onReady': () => { switchLesson(todayKey); checkLocalRecord(); } }
            });
            setInterval(() => {
                if (player && player.getPlayerState() === 1 && lEnd > 0) {
                    if (player.getCurrentTime() >= lEnd || player.getCurrentTime() < lStart - 0.2) player.seekTo(lStart);
                }
            }, 50);
        }

        function switchLesson(date) {
            const lesson = videoDB[date] || Object.values(videoDB)[0];
            if (!lesson) return;
            
            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('date-display').innerText = `📅 課程日期：${date}`;
            player.loadVideoById(lesson.id);

            const list = document.getElementById('subtitle-list');
            list.innerHTML = "";
            lesson.subs.forEach((s, i) => {
                const d = document.createElement('div');
                d.className = 'subtitle'; d.id = `sub-${i}`;
                d.onclick = () => {
                    lStart = s.t; lEnd = s.t + 2.2; targetJp = s.jp;
                    player.seekTo(lStart); player.playVideo();
                    document.querySelectorAll('.subtitle').forEach(el => el.classList.remove('active'));
                    d.classList.add('active');
                };
                d.innerHTML = `<div class="jp-text" style="font-weight:700;">${s.jp}</div><div class="zh-text">${s.zh}</div>`;
                list.appendChild(d);
            });
            if (lesson.subs[0]) { lStart = lesson.subs[0].t; lEnd = lesson.subs[0].t + 2.2; targetJp = lesson.subs[0].jp; }
        }

        function startSpeechAI() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return alert("請使用 Chrome 瀏覽器。");
            const rec = new SpeechRec(); rec.lang = 'ja-JP';
            rec.onstart = () => {
                document.getElementById('ai-box').style.display = 'block';
                document.getElementById('ai-status').innerHTML = '<span class="recording-status">🌸 AI 正在聽...</span>';
            };
            rec.onresult = (e) => {
                const res = e.results[0][0].transcript;
                document.getElementById('ai-transcript').innerText = res;
                const ok = res.replace(/[、。！？ ]/g, "") === targetJp.replace(/[、。！？ ]/g, "");
                document.getElementById('ai-result').innerHTML = ok ? '<span style="color:#F06292;">🌸 正確！</span>' : '<span style="color:#F48FB1;">💪 AI 聽到的是「'+res+'」</span>';
            };
            rec.onend = () => { document.getElementById('ai-status').innerText = "辨識結束"; };
            rec.start();
        }

        let mRec, chunks = [];
        async function toggleManualRecord() {
            const btn = document.getElementById('manual-record-btn');
            const p = document.getElementById('audio-playback');
            if (!mRec || mRec.state === "inactive") {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                mRec = new MediaRecorder(s); chunks = [];
                mRec.ondataavailable = e => chunks.push(e.data);
                mRec.onstop = () => { p.src = URL.createObjectURL(new Blob(chunks)); p.style.display = 'block'; };
                mRec.start(); btn.innerText = "🛑 停止錄音"; btn.classList.add('recording-status');
            } else { mRec.stop(); btn.innerText = "🎙️ 手動錄製比對"; btn.classList.remove('recording-status'); }
        }

        function saveMyProgress() {
            localStorage.setItem('yuli_dual_v2_'+todayKey, 'done');
            checkLocalRecord();
        }

        function checkLocalRecord() {
            if (localStorage.getItem('yuli_dual_v2_'+todayKey)) {
                document.getElementById('complete-btn').className = 'btn btn-done completed';
                document.getElementById('complete-btn').innerText = '🌸 今日練習達成';
            }
        }
        fetchCSV();
    </script>
</body>
</html>
