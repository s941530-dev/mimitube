<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MimiTube | Yuli 日語練習教室</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --macaron-pink: #FFD1DC; /* 櫻花粉 */
            --sakura-dark: #FF9AA2; 
            --macaron-green: #B2E2D2; /* 馬卡龍綠 */
            --mint-dark: #88C9B3; 
            --bg-soft: #FFF9FA; 
        }
        body { font-family: 'Zen Maru Gothic', sans-serif; background-color: var(--bg-soft); color: #6A6A6A; margin: 0; padding-bottom: 80px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; background: white; padding: 15px 0; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 4px 12px rgba(255,182,193,0.2); position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid var(--macaron-pink); }
        .logo { font-family: 'Quicksand', sans-serif; font-size: 26px; font-weight: 600; color: var(--sakura-dark); text-decoration: none; }
        .logo span { color: var(--macaron-green); }
        .calendar-btn { background: white; border: 2px solid var(--macaron-green); padding: 8px 18px; border-radius: 25px; cursor: pointer; color: var(--mint-dark); font-weight: bold; }
        .player-wrapper { width: 95%; max-width: 640px; aspect-ratio: 16 / 9; border-radius: 30px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 8px solid white; background: #000; margin: 20px 0; }
        .ai-feedback { background: white; padding: 20px; border-radius: 25px; width: 90%; max-width: 600px; border: 3px dashed var(--macaron-pink); display: none; margin-bottom: 15px; }
        .subtitle { background: white; margin: 10px; padding: 20px; border-radius: 20px; text-align: left; cursor: pointer; border: 3px solid #f0f0f0; width: 90%; max-width: 600px; transition: 0.3s; }
        .subtitle.active { border-color: var(--macaron-green); background: #F4FAF8; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; }
        .btn { border: none; border-radius: 50px; padding: 16px 30px; font-weight: bold; cursor: pointer; width: 90%; max-width: 400px; font-family: inherit; }
        .btn-ai { background: var(--sakura-dark); color: white; }
        .btn-record { background: var(--macaron-green); color: white; }
        audio { width: 90%; max-width: 400px; margin: 15px 0; display: none; }
        #date-picker { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="header">
        <a href="#" class="logo">Mimi<span>Tube</span></a>
        <button class="calendar-btn" onclick="openPicker()">📅 選日期</button>
        <input type="date" id="date-picker" onchange="switchLesson(this.value)">
    </div>
    <div class="player-wrapper"><div id="player"></div></div>
    <div id="ai-box" class="ai-feedback">
        <div id="ai-status" style="font-weight: bold; color: var(--sakura-dark);"></div>
        <div style="font-size: 0.9em; margin: 10px 0;">聽到的：<span id="ai-transcript" style="color:var(--mint-dark); font-weight:bold;">...</span></div>
        <div id="ai-result" style="font-weight: bold;"></div>
    </div>
    <div class="btn-group">
        <button class="btn btn-ai" onclick="startSpeechAI()">🌸 啟動 AI 校正發音</button>
        <button id="manual-record-btn" class="btn btn-record" onclick="toggleManualRecord()">🍵 手動錄音比對</button>
        <audio id="audio-playback" controls playsinline></audio>
    </div>
    <div id="subtitle-list"></div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEXKJakE6c7TwGFVBHEUjOYsq3Tr1GO_hZVruVJcsb3y2plxlflzjGjlmyjrU1yV43GxdZXGqn57ie/pub?output=csv";
        let videoDB = {}, player, lStart = 0, lEnd = 0, targetJp = "";
        const todayKey = new Date().toLocaleDateString('sv-SE');

        function openPicker() { document.getElementById('date-picker').showPicker ? document.getElementById('date-picker').showPicker() : document.getElementById('date-picker').click(); }

        async function fetchCSV() {
            const r = await fetch(`${SHEET_URL}&v=${Date.now()}`);
            const txt = await r.text();
            txt.split('\n').slice(1).forEach(line => {
                const c = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (c.length >= 4) {
                    const date = c[0].trim();
                    const sData = c[3].replace(/"/g, '').split('|').map(s => {
                        const p = s.split(',');
                        return { jp: p[0], zh: p[1], t: parseFloat(p[2]) || 0, d: parseFloat(p[3]) || 3 };
                    });
                    videoDB[date] = { id: c[1].replace(/["' ]/g, ""), title: c[2].replace(/"/g, ''), subs: sData };
                }
            });
            const t = document.createElement('script'); t.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(t);
        }

        function onYouTubeIframeAPIReady() {
            const lesson = videoDB[todayKey] || Object.values(videoDB)[0];
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: lesson ? lesson.id : '',
                playerVars: { 'playsinline': 1, 'rel': 0 },
                events: { 'onReady': () => { switchLesson(todayKey); } }
            });
            setInterval(() => { if (player && player.getPlayerState() === 1 && lEnd > 0) { if (player.getCurrentTime() >= lEnd) player.seekTo(lStart); } }, 40);
        }

        function switchLesson(date) {
            const lesson = videoDB[date] || Object.values(videoDB)[0];
            if (!lesson) return;
            player.loadVideoById(lesson.id);
            const list = document.getElementById('subtitle-list');
            list.innerHTML = "";
            lesson.subs.forEach(s => {
                const d = document.createElement('div');
                d.className = 'subtitle';
                d.onclick = () => {
                    lStart = s.t; lEnd = s.t + s.d; targetJp = s.jp;
                    player.seekTo(lStart); player.playVideo();
                    document.querySelectorAll('.subtitle').forEach(el => el.classList.remove('active'));
                    d.classList.add('active');
                };
                d.innerHTML = `<div style="font-weight:700;font-size:1.2em;">${s.jp}</div><div style="color:#999;font-size:0.9em;">${s.zh}</div>`;
                list.appendChild(d);
            });
            if (lesson.subs[0]) { lStart = lesson.subs[0].t; lEnd = lStart + lesson.subs[0].d; targetJp = lesson.subs[0].jp; }
        }

        function startSpeechAI() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return alert("Safari 請更新至最新版並在真正的 Safari 瀏覽器中開啟。");
            const rec = new SpeechRec(); rec.lang = 'ja-JP';
            rec.onstart = () => { document.getElementById('ai-box').style.display = 'block'; document.getElementById('ai-status').innerHTML = "🌸 <span style='color:red;'>正在聽...</span>"; };
            rec.onresult = (e) => {
                const res = e.results[0][0].transcript;
                document.getElementById('ai-transcript').innerText = res;
                const ok = res.replace(/[、。！？ ]/g, "") === targetJp.replace(/[、。！？ ]/g, "");
                document.getElementById('ai-result').innerHTML = ok ? '<span style="color:var(--sakura-dark);">🎯 完璧！發音正確！</span>' : '<span style="color:var(--mint-dark);">💪 聽起來像「'+res+'」</span>';
            };
            rec.onend = () => { document.getElementById('ai-status').innerText = "辨識結束"; };
            rec.start();
        }

        let mRec, chunks = [];
        async function toggleManualRecord() {
            const btn = document.getElementById('manual-record-btn');
            const p = document.getElementById('audio-playback');
            if (!mRec || mRec.state === "inactive") {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                const opt = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : { mimeType: 'audio/mp4' };
                mRec = new MediaRecorder(s, opt); chunks = [];
                mRec.ondataavailable = e => chunks.push(e.data);
                mRec.onstop = () => { p.src = URL.createObjectURL(new Blob(chunks, { type: mRec.mimeType })); p.style.display = 'block'; p.load(); };
                mRec.start(); btn.innerText = "🛑 停止錄製";
            } else { mRec.stop(); btn.innerText = "🍵 手動錄音比對"; }
        }
        fetchCSV();
    </script>
</body>
</html>
